# ============================================================
# 营销情报数据源清单
# ------------------------------------------------------------
# 支持两种数据源类型：
#   type: rss       —— 原生 RSS 地址 / RSSHub 路由（feedparser 抓取）
#   type: scraper   —— 自定义 Python 爬虫（在 scrapers/ 下注册）
#
# 公众号源走 RSSHub 的微信路由（/wechat/ce/:mid），无需额外服务。
# 如要自建 RSSHub，修改下方 rsshub_base 即可。
#
# 每个源建议都填上 original_url（源站首页），采集脚本会在抓取失败时
# 把这个链接和实际抓取 URL 一并打印到日志，方便排查和切源。
# ============================================================

rsshub_base: "https://rsshub.app"

sources:
  # ---------- 行业研报 ----------
  - name: CBNData 消费站
    category: 行业研报
    rsshub: /cbndata/information
    original_url: https://www.cbndata.com/
  - name: 艾瑞咨询
    category: 行业研报
    rsshub: /iresearch/report
    original_url: https://www.iresearch.com.cn/
  - name: 199IT 互联网数据资讯网
    category: 行业研报
    url: https://www.199it.com/feed
    original_url: https://www.199it.com/
  - name: QuestMobile
    category: 行业研报
    rsshub: /questmobile/report
    original_url: https://www.questmobile.com.cn/
  - name: 麦肯锡中国
    category: 行业研报
    rsshub: /mckinseychina/latest
    original_url: https://www.mckinsey.com.cn/
  - name: 易观分析
    category: 行业研报
    rsshub: /analysys/report
    original_url: https://www.analysys.cn/

  # ---------- 平台洞察（公众号）----------
  # 微信公众号源：RSSHub 的 /wechat/ce/:mid 路由，把公众号转成 RSS。
  # 公共实例 rsshub.app 频率有限，建议在 routes.yaml 找到这些公众号 ID。
  - name: 巨量引擎营销观察
    category: 平台洞察
