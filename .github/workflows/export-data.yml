name: 导出 Notion 数据为 JSON

on:
  schedule:
    # 每 30 分钟导出一次，让 GitHub Pages 上的数据保持新鲜
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发
  workflow_call: {}        # 支持被其他 workflow 调用（如 collect.yml 跑完后触发）

# 防止上一次还没跑完就启动下一次
concurrency:
  group: export-data
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推送 commit 需要写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行导出
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python collector/export_data.py

      - name: 检查变更
        id: check
        run: |
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data.json 无变化，跳过 commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data.json 有更新"
          fi

      - name: 提交并推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Marketing Intel Bot"
          git config user.email "marketing-intel-bot@local"
          git add docs/data.json
          git commit -m "data: update Notion export ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          # Pages 在 push 到 main 后会自动重新部署